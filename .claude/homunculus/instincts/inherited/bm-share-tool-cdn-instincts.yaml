# Bm Share Tool Cdn Workflow Deploy New Extension Version

## Action

Follow the deploy-new-extension-version workflow:
1. Build and sign the new bm-share-tool.crx file.
2. Update index.html with new install instructions or version info.
3. Update update.xml with the new version and CRX URL.
4. Commit and deploy all updated files to the CDN repository.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~4x per month
- Files: bm-share-tool.crx, index.html, update.xml

